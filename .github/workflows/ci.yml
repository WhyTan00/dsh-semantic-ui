name: checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      chart_only:
        description: Validate the changed chart path; full host matrix otherwise
        type: boolean
        default: false
      consistency_only:
        description: Validate declarations and archive-installed Native/PTC; skip old full matrices
        type: boolean
        default: false
      source_only:
        description: Validate source-bound Decision and permissions from the installed archive
        type: boolean
        default: false
      mcp_only:
        description: Validate archived read-only MCP and initialization workflow without DSH or model calls
        type: boolean
        default: false
      numeric_delivery_only:
        description: Validate source-bound numeric render and installed Native/PTC only
        type: boolean
        default: false
      conditional_only:
        description: Validate normalized conditional source delivery from a frozen archive
        type: boolean
        default: false
      source_update_only:
        description: Validate a single unknown boolean supplement through normal prompt and durable source adoption
        type: boolean
        default: false
      cold_source_only:
        description: Validate cold read-only source offers, explicit resume and original receipt recovery in installed Native/PTC
        type: boolean
        default: false
      capacity_contract_only:
        description: Validate discoverable capacity field contract and precise label diagnostics from final archive
        type: boolean
        default: false
      capacity_only:
        description: Validate complete capacity source mapping and archive-installed numeric exploration with legacy restore
        type: boolean
        default: false
      workflow_only:
        description: Validate complete workflow failure-rule mapping and final archive Native/PTC with legacy graph restore
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - run: git diff --exit-code -- SKILL.md docs/generated/protocol.schema.json docs/generated/template.schema.json
      - run: pnpm research:check
      - run: pnpm check
        if: github.event_name != 'workflow_dispatch' || !(inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only || inputs.conditional_only || inputs.source_update_only || inputs.cold_source_only || inputs.workflow_only || inputs.capacity_only || inputs.capacity_contract_only)
      - name: Check declaration source
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/decision-consistency.test.ts tests/grounding.test.ts tests/grounding-direction.test.ts tests/mcp.test.ts
          pnpm build
      - name: Check source-bound delivery
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/decision-delivery.test.ts tests/source-delivery.test.ts tests/replay.test.ts tests/host-source.test.ts tests/mcp.test.ts
          pnpm test:release-isolation
      - name: Check read-only MCP workflow
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/mcp.test.ts tests/mcp-instructions.test.ts tests/source-numeric.test.ts tests/source-numeric-mcp.test.ts tests/source-input.test.ts
          pnpm test:release-isolation
      - name: Check numeric source delivery
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/numeric-delivery.test.ts
      - name: Check conditional source contracts
        if: github.event_name == 'workflow_dispatch' && inputs.conditional_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/source-condition.test.ts tests/source-decision.test.ts tests/decision-delivery.test.ts
      - name: Check source supplementation contracts
        if: github.event_name == 'workflow_dispatch' && inputs.source_update_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/source-update.test.ts tests/host-source.test.ts tests/source-condition.test.ts tests/decision-delivery.test.ts tests/replay.test.ts
      - name: Check cold source contracts
        if: github.event_name == 'workflow_dispatch' && inputs.cold_source_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/source-update.test.ts tests/source-update-cold.test.ts tests/host-source.test.ts tests/source-condition.test.ts tests/decision-delivery.test.ts tests/replay.test.ts
      - name: Check capacity representation diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_contract_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/capacity-contract.test.ts tests/source-capacity.test.ts tests/source-capacity-mcp.test.ts tests/source-delivery.test.ts
      - name: Check capacity source contracts
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/source-capacity.test.ts tests/source-capacity-mcp.test.ts tests/source-input.test.ts tests/source-delivery.test.ts tests/source-decision.test.ts tests/host-source.test.ts tests/replay.test.ts tests/templates.test.ts
          python3 -m unittest discover -s tests -p 'test_codex_*.py'
      - name: Check complete workflow contracts
        if: github.event_name == 'workflow_dispatch' && inputs.workflow_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/source-workflow.test.ts tests/source-workflow-mcp.test.ts tests/source-graph.test.ts tests/source-input.test.ts tests/source-delivery.test.ts tests/host-source.test.ts tests/replay.test.ts tests/templates.test.ts
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'workflow_dispatch' || !inputs.mcp_only
      - run: pnpm test:host
        if: github.event_name != 'workflow_dispatch' || !(inputs.chart_only || inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only || inputs.conditional_only || inputs.source_update_only || inputs.cold_source_only || inputs.workflow_only || inputs.capacity_only || inputs.capacity_contract_only)
      - run: pnpm test:chart-host
        if: github.event_name != 'workflow_dispatch' || !(inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only || inputs.conditional_only || inputs.source_update_only || inputs.cold_source_only || inputs.workflow_only || inputs.capacity_only || inputs.capacity_contract_only)
      - run: pnpm test:consistency-host
        if: github.event_name != 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: semantic-ui-fixture-diagnostics
          path: |
            artifacts/local/host-*/native/evidence/*.json
            artifacts/local/host-*/ptc/evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm release:pack
      - run: node tests/installed-capacity-contract.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_contract_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_contract_only
        with:
          name: capacity-contract-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/capacity-contract.json
            artifacts/local/host-*/ptc/evidence/capacity-contract.json
            artifacts/local/host-*/cleanup.json
          if-no-files-found: error
      - run: node tests/installed-capacity.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_only
        with:
          name: capacity-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/capacity-delivery.json
            artifacts/local/host-*/ptc/evidence/capacity-delivery.json
            artifacts/local/host-*/cleanup.json
          if-no-files-found: error
      - run: node tests/installed-workflow.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.workflow_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.workflow_only
        with:
          name: workflow-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/workflow-delivery.json
            artifacts/local/host-*/ptc/evidence/workflow-delivery.json
            artifacts/local/host-*/cleanup.json
          if-no-files-found: error
      - run: node tests/installed-cold-source.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.cold_source_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.cold_source_only
        with:
          name: cold-source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/cold-*.json
            artifacts/local/host-*/ptc/evidence/cold-*.json
            artifacts/local/host-*/cleanup.json
          if-no-files-found: error
      - run: node tests/installed-source-update.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.source_update_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.source_update_only
        with:
          name: source-update-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/source-update.json
            artifacts/local/host-*/ptc/evidence/source-update.json
            artifacts/local/host-*/cleanup.json
          if-no-files-found: error
      - run: node tests/installed-condition.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.conditional_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.conditional_only
        with:
          name: conditional-source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/conditional-delivery.json
            artifacts/local/host-*/ptc/evidence/conditional-delivery.json
          if-no-files-found: error
      - run: pnpm test:installed-numeric
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
        with:
          name: numeric-source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/numeric-delivery.json
            artifacts/local/host-*/ptc/evidence/numeric-delivery.json
          if-no-files-found: error
      - run: pnpm test:installed-mcp
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
        with:
          name: mcp-install-receipts
          path: artifacts/local/mcp-*.json
          if-no-files-found: error
      - run: pnpm test:installed-source
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
        with:
          name: source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/decision-delivery.json
            artifacts/local/host-*/ptc/evidence/decision-delivery.json
          if-no-files-found: error
      - run: pnpm test:installed-consistency
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only && !inputs.conditional_only && !inputs.source_update_only && !inputs.cold_source_only && !inputs.workflow_only && !inputs.capacity_only && !inputs.capacity_contract_only
        with:
          name: declaration-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/consistency.json
            artifacts/local/host-*/ptc/evidence/consistency.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-ui-preview-package
          path: |
            artifacts/releases/**/*.tgz
            artifacts/releases/**/SHA256SUMS
            artifacts/releases/**/package-manifest.json
          if-no-files-found: error
