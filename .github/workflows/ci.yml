name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - run: git diff --exit-code -- SKILL.md docs/generated/protocol.schema.json docs/generated/template.schema.json
      - run: pnpm research:check
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:host
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: semantic-ui-fixture-diagnostics
          path: |
            artifacts/local/host-*/native/evidence/*.json
            artifacts/local/host-*/ptc/evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-ui-preview-package
          path: |
            artifacts/releases/**/*.tgz
            artifacts/releases/**/SHA256SUMS
            artifacts/releases/**/package-manifest.json
          if-no-files-found: error
