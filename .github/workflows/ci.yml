name: checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      chart_only:
        description: Validate the changed chart path; full host matrix otherwise
        type: boolean
        default: false
      consistency_only:
        description: Validate declarations and archive-installed Native/PTC; skip old full matrices
        type: boolean
        default: false
      source_only:
        description: Validate source-bound Decision and permissions from the installed archive
        type: boolean
        default: false
      mcp_only:
        description: Validate archived read-only MCP and initialization workflow without DSH or model calls
        type: boolean
        default: false
      numeric_delivery_only:
        description: Validate source-bound numeric render and installed Native/PTC only
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:generate
      - run: git diff --exit-code -- SKILL.md docs/generated/protocol.schema.json docs/generated/template.schema.json
      - run: pnpm research:check
      - run: pnpm check
        if: github.event_name != 'workflow_dispatch' || !(inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only)
      - name: Check declaration source
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/decision-consistency.test.ts tests/grounding.test.ts tests/grounding-direction.test.ts tests/mcp.test.ts
          pnpm build
      - name: Check source-bound delivery
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/decision-delivery.test.ts tests/source-delivery.test.ts tests/replay.test.ts tests/host-source.test.ts tests/mcp.test.ts
          pnpm test:release-isolation
      - name: Check read-only MCP workflow
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/mcp.test.ts tests/mcp-instructions.test.ts tests/source-numeric.test.ts tests/source-numeric-mcp.test.ts tests/source-input.test.ts
          pnpm test:release-isolation
      - name: Check numeric source delivery
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/numeric-delivery.test.ts
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name != 'workflow_dispatch' || !inputs.mcp_only
      - run: pnpm test:host
        if: github.event_name != 'workflow_dispatch' || !(inputs.chart_only || inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only)
      - run: pnpm test:chart-host
        if: github.event_name != 'workflow_dispatch' || !(inputs.consistency_only || inputs.source_only || inputs.mcp_only || inputs.numeric_delivery_only)
      - run: pnpm test:consistency-host
        if: github.event_name != 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: semantic-ui-fixture-diagnostics
          path: |
            artifacts/local/host-*/native/evidence/*.json
            artifacts/local/host-*/ptc/evidence/*.json
          retention-days: 7
          if-no-files-found: ignore
      - run: pnpm release:pack
      - run: pnpm test:installed-numeric
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.numeric_delivery_only
        with:
          name: numeric-source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/numeric-delivery.json
            artifacts/local/host-*/ptc/evidence/numeric-delivery.json
          if-no-files-found: error
      - run: pnpm test:installed-mcp
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.mcp_only
        with:
          name: mcp-install-receipts
          path: artifacts/local/mcp-*.json
          if-no-files-found: error
      - run: pnpm test:installed-source
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
        with:
          name: source-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/decision-delivery.json
            artifacts/local/host-*/ptc/evidence/decision-delivery.json
          if-no-files-found: error
      - run: pnpm test:installed-consistency
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.consistency_only && !inputs.source_only && !inputs.mcp_only && !inputs.numeric_delivery_only
        with:
          name: declaration-install-receipts
          path: |
            artifacts/local/host-*/install.json
            artifacts/local/host-*/installed-byte-check.json
            artifacts/local/host-*/native/evidence/consistency.json
            artifacts/local/host-*/ptc/evidence/consistency.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-ui-preview-package
          path: |
            artifacts/releases/**/*.tgz
            artifacts/releases/**/SHA256SUMS
            artifacts/releases/**/package-manifest.json
          if-no-files-found: error
